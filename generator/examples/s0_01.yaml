name: Twelve-One Momentum (flagship)
description: 'Standard 12-1 cross-sectional momentum: twelve-month price change excluding the most recent
  month, ranked daily on the liquid subset of the point-in-time universe (bottom volume quintile excluded
  each day), 21-day holding costs modeled conservatively at 15 bps per side.'
pseudocode: score = rank(pct_change(close, 252) - pct_change(close, 21)) * (rank(volume) > -0.30)
params:
  universe: all
  horizon: 21
  costs_bps: 15.0
  rebalance: weekly
notes: null
