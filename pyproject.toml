[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalgate"
version = "0.1.0"
description = "Agentic research-integrity gate for candidate trading signals - statistical probes as tools, verdicts with receipts."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Prakhar Shukla" }]
keywords = ["quant", "research-integrity", "backtest", "agents", "evaluation"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "jinja2>=3.1,<4",
  "typer>=0.12,<1",
  "pydantic>=2.9,<3",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
signalgate = "signalgate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/signalgate", "generator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "generator", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's idiom is Option() in defaults
"src/signalgate/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: full-fidelity end-to-end eval tests (run via `make test`)",
]
