<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="560" viewBox="0 0 1640 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="26%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0b1410"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8b98a5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1640" height="560" fill="url(#glow)"/>
  <rect width="1640" height="560" fill="url(#grid)"/>

  <!-- signal scatter, right side: survivors emerald, rejects muted rose -->
  <g opacity="0.9">
    <circle cx="1180" cy="90" r="7" fill="#34d399" opacity="0.55"/>
    <circle cx="1250" cy="150" r="4" fill="#34d399" opacity="0.35"/>
    <circle cx="1330" cy="110" r="9" fill="#34d399" opacity="0.45"/>
    <circle cx="1420" cy="180" r="5" fill="#712f36" opacity="0.6"/>
    <circle cx="1520" cy="90" r="6" fill="#34d399" opacity="0.5"/>
    <circle cx="1290" cy="240" r="11" fill="#34d399" opacity="0.6"/>
    <circle cx="1470" cy="270" r="4" fill="#712f36" opacity="0.5"/>
    <circle cx="1370" cy="330" r="6" fill="#34d399" opacity="0.4"/>
    <circle cx="1230" cy="380" r="8" fill="#34d399" opacity="0.5"/>
    <circle cx="1540" cy="220" r="10" fill="#34d399" opacity="0.55"/>
    <circle cx="1160" cy="310" r="5" fill="#712f36" opacity="0.55"/>
    <circle cx="1440" cy="400" r="7" fill="#34d399" opacity="0.45"/>
    <circle cx="1560" cy="360" r="4" fill="#34d399" opacity="0.35"/>
    <circle cx="1260" cy="450" r="6" fill="#34d399" opacity="0.4"/>
    <circle cx="1380" cy="470" r="4" fill="#712f36" opacity="0.5"/>
    <circle cx="1500" cy="480" r="8" fill="#34d399" opacity="0.5"/>
    <circle cx="1180" cy="180" r="3" fill="#34d399" opacity="0.3"/>
    <circle cx="1600" cy="140" r="5" fill="#34d399" opacity="0.45"/>
  </g>

  <!-- gate mark: an arch with a passing dot -->
  <g transform="translate(90,150)">
    <circle cx="70" cy="70" r="108" fill="none" stroke="#8b98a5" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="88" fill="none" stroke="#8b98a5" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M 20 130 L 20 70 Q 20 10 70 10 Q 120 10 120 70 L 120 130"
          fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
    <line x1="145" y1="-12" x2="86" y2="52" stroke="#e8edf2" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="98" r="9" fill="#e8edf2"/>
    <circle cx="70" cy="98" r="16" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="250" font-size="92" font-weight="700" fill="#e8edf2" letter-spacing="-2">SignalGate</text>
  <text x="365" y="300" font-family="Consolas, monospace" font-size="21" fill="#8b98a5" letter-spacing="9">RESEARCH-INTEGRITY GATE</text>

  <!-- verdict chips -->
  <g font-family="Consolas, monospace" font-size="15" letter-spacing="1.5">
    <rect x="365" y="330" width="250" height="40" rx="8" fill="none" stroke="#fb7185" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="390" cy="350" r="6" fill="none" stroke="#fb7185" stroke-width="2"/>
    <text x="408" y="356" fill="#fb7185">REJECT_SPURIOUS</text>

    <rect x="630" y="330" width="230" height="40" rx="8" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="655" cy="350" r="6" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="673" y="356" fill="#fbbf24">NEEDS_REVIEW</text>

    <rect x="875" y="330" width="205" height="40" rx="8" fill="none" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="900" cy="350" r="6" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="918" y="356" fill="#34d399">PROMISING</text>
  </g>

  <!-- tagline -->
  <line x1="90" y1="450" x2="1550" y2="450" stroke="#1b232c" stroke-width="1.5"/>
  <text x="365" y="495" font-family="Consolas, monospace" font-size="18" fill="#8b98a5">statistical probes investigate every candidate signal &#183; verdicts with receipts &#183; silence unless it deserves an hour</text>
</svg>
